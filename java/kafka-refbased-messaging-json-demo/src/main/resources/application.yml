topic:
  name: person-json
  replication-factor: 3
  partitions: 8

spring:
  kafka:
    bootstrap-servers:
      - ${DATAPLATFORM_IP}:9092
      - ${DATAPLATFORM_IP}:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      # JSON instead of Avro - the header interceptors treat the value as opaque, so any serializer works
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # no type headers: the reference-based consumer reconstructs via a configured default type
        spring.json.add.type.headers: false
        # serializer-agnostic header variant: reference travels in headers, value is sent as null
        interceptor.classes: com.trivadis.kafka.claimcheck.interceptor.ProducerInterceptorToStorageHeaders
        interceptor.storage.bucket.name: refbased-json-bucket
        # optional key prefix ("folder") the externalized objects are stored under
        interceptor.storage.object.prefix: ${topic}
        # optional time-based partitioning for retention: none | monthly | daily | hourly
        interceptor.storage.partition.granularity: daily
        # only externalize payloads larger than this many bytes; small Person records stay inline,
        # the padded "large" ones from the demo producer exceed this and are stored in S3
        interceptor.storage.size.threshold.bytes: 1024
        interceptor.storage.access.key: admin
        interceptor.storage.secret.key: abc123abc123!
        interceptor.storage.service.endpoint: http://${DATAPLATFORM_IP}:9005
        interceptor.storage.region: us-east-2
    consumer:
      group-id: refbased-json-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # the stored JSON carries no type headers, so pin the target type explicitly
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.trivadis.kafkaws.springbootkafkainterceptor.Person
        spring.json.trusted.packages: "*"
        interceptor.classes: com.trivadis.kafka.claimcheck.interceptor.ConsumerInterceptorToStorageHeaders
        interceptor.storage.access.key: admin
        interceptor.storage.secret.key: abc123abc123!
        interceptor.storage.service.endpoint: http://${DATAPLATFORM_IP}:9005
        interceptor.storage.region: us-east-2

cloud:
  aws:
    credentials:
      accessKey: admin
      secretKey: abc123abc123!
    region.static: us-east-1

producer-app:
  aws:
    service-endpoint: http://${DATAPLATFORM_IP}:9005
