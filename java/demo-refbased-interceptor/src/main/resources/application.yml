topic:
  name: person
  replication-factor: 3
  partitions: 8

bucket:
  person:
    name: person-ref-bucket
  product:
    name: product-ref-bucket

spring:
  kafka:
    bootstrap-servers:
      - ${DATAPLATFORM_IP}:9092
      - ${DATAPLATFORM_IP}:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: false
        use.latest.version: true
        interceptor.classes: com.trivadis.kafkaws.springbootkafkainterceptor.interceptor.ProducerInterceptorToStorage
        interceptor.storage.bucket.name: person-ref-bucket
    consumer:
      group-id: refbased-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        interceptor.classes: com.trivadis.kafkaws.springbootkafkainterceptor.interceptor.ConsumerInterceptorToStorage
    properties:
      schema.registry.url: http://${DATAPLATFORM_IP}:8081

cloud:
  aws:
    credentials:
      accessKey: admin
      secretKey: abc123abc123!
    region.static: us-east-1

producer-app:
  aws:
    service-endpoint: http://${DATAPLATFORM_IP}:9005
